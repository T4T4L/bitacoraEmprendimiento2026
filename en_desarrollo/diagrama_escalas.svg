<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <style>
      .text-title { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; fill: #173126; text-anchor: middle; }
      .text-sub { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; fill: #284638; text-anchor: middle; }
      .line { stroke: #7D8B62; stroke-width: 4; stroke-dasharray: 8, 8; }
      .box { fill: #F6F3EC; stroke: #284638; stroke-width: 3; rx: 12; transition: all 0.3s ease; }
      .box-hover:hover { fill: #D8CEB8; cursor: pointer; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Connecting Line -->
  <line x1="100" y1="200" x2="900" y2="200" class="line" />

  <!-- 1: Punto -->
  <g transform="translate(100, 200)">
    <circle cx="0" cy="0" r="30" fill="#6E293B" />
    <circle cx="0" cy="0" r="10" fill="#F6F3EC" />
    <text x="0" y="60" class="text-title">Punto</text>
    <text x="0" y="85" class="text-sub">1 Hoja/Baya</text>
  </g>

  <!-- 2: Planta -->
  <g transform="translate(260, 200)">
    <rect x="-40" y="-40" width="80" height="80" class="box box-hover" />
    <circle cx="0" cy="-10" r="15" fill="#284638" />
    <path d="M-5 5 L5 5 L5 25 L-5 25 Z" fill="#C68A38" />
    <text x="0" y="70" class="text-title">Planta</text>
    <text x="0" y="95" class="text-sub">Unidad vital</text>
  </g>

  <!-- 3: Segmento -->
  <g transform="translate(420, 200)">
    <rect x="-50" y="-50" width="100" height="100" class="box box-hover" />
    <circle cx="-20" cy="0" r="10" fill="#7D8B62" />
    <circle cx="0" cy="0" r="10" fill="#7D8B62" />
    <circle cx="20" cy="0" r="10" fill="#7D8B62" />
    <text x="0" y="80" class="text-title">Segmento</text>
    <text x="0" y="105" class="text-sub">Tramo hilera</text>
  </g>

  <!-- 4: Hilera -->
  <g transform="translate(580, 200)">
    <rect x="-60" y="-60" width="120" height="120" class="box box-hover" />
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#173126" stroke-width="6" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#173126" stroke-width="6" stroke-linecap="round"/>
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#173126" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="90" class="text-title">Hilera</text>
    <text x="0" y="115" class="text-sub">Unidad de paso</text>
  </g>

  <!-- 5: Zona -->
  <g transform="translate(740, 200)">
    <rect x="-70" y="-70" width="140" height="140" class="box box-hover" />
    <rect x="-40" y="-40" width="30" height="30" fill="#D8CEB8" rx="4"/>
    <rect x="10" y="-40" width="30" height="30" fill="#7D8B62" rx="4"/>
    <rect x="-40" y="10" width="30" height="30" fill="#7D8B62" rx="4"/>
    <rect x="10" y="10" width="30" height="30" fill="#D8CEB8" rx="4"/>
    <text x="0" y="100" class="text-title">Zona</text>
    <text x="0" y="125" class="text-sub">Variabilidad</text>
  </g>

  <!-- 6: Cuartel -->
  <g transform="translate(900, 200)">
    <rect x="-80" y="-80" width="160" height="160" class="box box-hover" style="fill:#284638; stroke:#C68A38; stroke-width:4;" />
    <rect x="-50" y="-50" width="100" height="100" fill="#173126" rx="8"/>
    <text x="0" y="110" class="text-title" style="fill:#173126;">Cuartel</text>
    <text x="0" y="135" class="text-sub" style="fill:#6E293B; font-weight:700;">Unidad de manejo</text>
  </g>

</svg>

