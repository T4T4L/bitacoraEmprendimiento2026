<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <style>
      .axis { stroke: #D8CEB8; stroke-width: 2; }
      .grid-line { stroke: #F6F3EC; stroke-width: 1; fill: none; }
      .label { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; fill: #173126; text-anchor: middle; }
      .legend-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #202420; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <g transform="translate(300, 300)">
    <!-- Grid Polygons (Radar webs) -->
    <!-- Level 1 (outer) -->
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" class="grid-line" stroke="#D8CEB8" />
    <!-- Level 2 -->
    <polygon points="0,-133 115,-66 115,66 0,133 -115,66 -115,-66" class="grid-line" />
    <!-- Level 3 (inner) -->
    <polygon points="0,-66 57,-33 57,33 0,66 -57,33 -57,-33" class="grid-line" />

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-200" class="axis" />
    <line x1="0" y1="0" x2="173" y2="-100" class="axis" />
    <line x1="0" y1="0" x2="173" y2="100" class="axis" />
    <line x1="0" y1="0" x2="0" y2="200" class="axis" />
    <line x1="0" y1="0" x2="-173" y2="100" class="axis" />
    <line x1="0" y1="0" x2="-173" y2="-100" class="axis" />

    <!-- Labels -->
    <text x="0" y="-220" class="label">Cobertura Espacial</text>
    <text x="210" y="-110" class="label">Detalle/Resolución</text>
    <text x="210" y="120" class="label">Frecuencia</text>
    <text x="0" y="230" class="label">Cercanía a Canopia</text>
    <text x="-210" y="120" class="label">Nivel de Interpretación</text>
    <text x="-210" y="-110" class="label">Bajo Esfuerzo Físico</text>

    <!-- Data: Drones/Satélites (Blue/Cyan in a nature palette? Let's use Olive) -->
    <!-- Alta cobertura, bajo detalle bajo hojas, media frecuencia, nula cercania, baja int, alto esfuerzo -->
    <polygon points="0,-180 50,-50 100,50 0,30 -50,-50 -150,-150" fill="rgba(125, 139, 98, 0.4)" stroke="#7D8B62" stroke-width="3" />
    
    <!-- Data: Sensores Fijos IoT (Amber) -->
    <!-- Baja cobertura, alto detalle (punto), alta frecuencia, alta cercania, baja int, alto esfuerzo(poco esf físico) -->
    <polygon points="0,-30 150,-50 180,100 0,150 -50,50 -180,-100" fill="rgba(198, 138, 56, 0.4)" stroke="#C68A38" stroke-width="3" />

    <!-- Data: Scouting Humano (Wine) -->
    <!-- Baja cobertura, alto detalle, baja frecuencia, alta cercanía, alta interpretación, bajo esfuerzo(alto esf físico) -->
    <polygon points="0,-60 180,-150 50,50 0,180 -180,150 -50,-50" fill="rgba(110, 41, 59, 0.4)" stroke="#6E293B" stroke-width="3" />
  </g>

  <!-- Legend -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="20" height="20" fill="rgba(125, 139, 98, 0.4)" stroke="#7D8B62" stroke-width="2" />
    <text x="30" y="15" class="legend-text">Drones / Satélites</text>
    
    <rect x="0" y="30" width="20" height="20" fill="rgba(198, 138, 56, 0.4)" stroke="#C68A38" stroke-width="2" />
    <text x="30" y="45" class="legend-text">Sensores Fijos IoT</text>
    
    <rect x="0" y="60" width="20" height="20" fill="rgba(110, 41, 59, 0.4)" stroke="#6E293B" stroke-width="2" />
    <text x="30" y="75" class="legend-text">Scouting Humano</text>
  </g>
</svg>

